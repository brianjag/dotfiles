# Alacritty configuration
# TOML format: alacritty 0.13+ (Debian 13 / Trixie). Older releases used YAML.

[window]
opacity = 0.8
decorations_theme_variant = "Dark"

[window.dimensions]
columns = 120
lines = 30

[font]
size = 14.0

[font.normal]
family = "Fira Code"

[cursor.style]
shape = "Beam"
blinking = "On"

# Catppuccin Mocha
[colors.primary]
background = "#1e1e2e"
foreground = "#cdd6f4"
dim_foreground = "#7f849c"
bright_foreground = "#cdd6f4"

[colors.cursor]
text = "#1e1e2e"
cursor = "#f5e0dc"

[colors.selection]
text = "#1e1e2e"
background = "#585b70"

[colors.normal]
black = "#45475a"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#bac2de"

[colors.bright]
black = "#585b70"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#a6adc8"
